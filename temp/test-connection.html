<!DOCTYPE html>
<html>
<head>
    <title>Test MCP Client Connection</title>
</head>
<body>
    <h1>Testing MCP Client Connection</h1>
    <p>This page tests if the WebSocket connection works with the existing server.</p>
    
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script>
        // Test WebSocket connection
        const ws = new WebSocket('ws://localhost:8080');
        
        ws.onopen = function(event) {
            document.getElementById('status').innerHTML = '<span style="color: green;">Connected!</span>';
            
            // Send a test message
            const testMsg = {
                type: 'test_connection',
                clientId: 'test-browser-client',
                timestamp: new Date().toISOString()
            };
            ws.send(JSON.stringify(testMsg));
        };
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            document.getElementById('messages').innerHTML += 
                '<p><strong>Received:</strong> ' + JSON.stringify(data, null, 2) + '</p>';
        };
        
        ws.onclose = function(event) {
            document.getElementById('status').innerHTML = 
                '<span style="color: red;">Connection closed</span>';
        };
        
        ws.onerror = function(error) {
            document.getElementById('status').innerHTML = 
                '<span style="color: red;">Error: ' + error.message + '</span>';
        };
    </script>
</body>
</html>
