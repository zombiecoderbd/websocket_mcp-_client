<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZombieCoder MCP Server Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .stat-card p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .status-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .status-online {
            background: #27ae60;
            box-shadow: 0 0 10px #27ae60;
        }
        
        .status-offline {
            background: #e74c3c;
        }
        
        .status-warning {
            background: #f39c12;
        }
        
        .controls {
            padding: 30px;
            background: #ecf0f1;
            text-align: center;
        }
        
        .btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #219653 100%);
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        
        .logs {
            padding: 30px;
            background: #2c3e50;
            color: white;
        }
        
        .logs h2 {
            margin-bottom: 20px;
            color: #ecf0f1;
        }
        
        .log-entry {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .log-timestamp {
            color: #3498db;
            margin-right: 10px;
        }
        
        .log-info {
            color: #27ae60;
        }
        
        .log-warning {
            color: #f39c12;
        }
        
        .log-error {
            color: #e74c3c;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background: #34495e;
            color: #ecf0f1;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧟‍♂️ ZombieCoder MCP Server</h1>
            <p>Admin Panel - Real-time System Monitoring</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="agentCount">0</h3>
                <p>Active Agents</p>
            </div>
            <div class="stat-card">
                <h3 id="connectionCount">0</h3>
                <p>Active Connections</p>
            </div>
            <div class="stat-card">
                <h3 id="cpuUsage">0%</h3>
                <p>CPU Usage</p>
            </div>
            <div class="stat-card">
                <h3 id="memoryUsage">0 MB</h3>
                <p>Memory Usage</p>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-success" onclick="refreshData()">🔄 Refresh Data</button>
            <button class="btn btn-warning" onclick="clearLogs()">🧹 Clear Logs</button>
            <button class="btn btn-danger" onclick="shutdownServer()">⚡ Shutdown Server</button>
        </div>
        
        <div class="logs">
            <h2>📋 System Logs</h2>
            <div id="logContainer">
                <div class="log-entry">
                    <span class="log-timestamp">[System]</span>
                    <span class="log-info">Admin panel initialized</span>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>ZombieCoder MCP Server Admin Panel v1.0.0 | Powered by Sahon Srabon</p>
        </div>
    </div>

    <script>
        // WebSocket connection for real-time updates
        let ws = null;
        
        function connectWebSocket() {
            try {
                ws = new WebSocket(`ws://localhost:3003`);
                
                ws.onopen = function(event) {
                    addLog('WebSocket connected', 'info');
                    ws.send(JSON.stringify({ type: 'admin_connect', timestamp: new Date().toISOString() }));
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    } catch (error) {
                        addLog(`Message parse error: ${error.message}`, 'error');
                    }
                };
                
                ws.onclose = function(event) {
                    addLog('WebSocket disconnected', 'warning');
                    // Attempt to reconnect after 5 seconds
                    setTimeout(connectWebSocket, 5000);
                };
                
                ws.onerror = function(error) {
                    addLog(`WebSocket error: ${error.message}`, 'error');
                };
            } catch (error) {
                addLog(`WebSocket connection failed: ${error.message}`, 'error');
            }
        }
        
        function handleWebSocketMessage(data) {
            switch(data.type) {
                case 'agent_update':
                    updateAgentStats(data.agents);
                    break;
                case 'connection_update':
                    updateConnectionStats(data.connections);
                    break;
                case 'system_metrics':
                    updateSystemMetrics(data.metrics);
                    break;
                case 'log_entry':
                    addLog(data.message, data.level || 'info');
                    break;
            }
        }
        
        function updateAgentStats(agents) {
            document.getElementById('agentCount').textContent = agents.active || 0;
        }
        
        function updateConnectionStats(connections) {
            document.getElementById('connectionCount').textContent = connections.active || 0;
        }
        
        function updateSystemMetrics(metrics) {
            if (metrics.cpu) {
                document.getElementById('cpuUsage').textContent = `${metrics.cpu.toFixed(1)}%`;
            }
            if (metrics.memory) {
                document.getElementById('memoryUsage').textContent = `${Math.round(metrics.memory / 1024 / 1024)} MB`;
            }
        }
        
        function addLog(message, level = 'info') {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            const timestamp = new Date().toLocaleTimeString();
            logEntry.innerHTML = `
                <span class="log-timestamp">[${timestamp}]</span>
                <span class="log-${level}">${message}</span>
            `;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Keep only last 50 log entries
            if (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }
        
        function refreshData() {
            fetch('/api/health')
                .then(response => response.json())
                .then(data => {
                    addLog(`Health check: ${data.status}`, 'info');
                })
                .catch(error => {
                    addLog(`Health check failed: ${error.message}`, 'error');
                });
                
            fetch('/api/dashboard/stats')
                .then(response => response.json())
                .then(data => {
                    updateAgentStats({ active: data.agentStats?.activeAgents || 0 });
                    updateConnectionStats({ active: data.connectionStats?.activeConnections || 0 });
                    addLog('Dashboard data refreshed', 'info');
                })
                .catch(error => {
                    addLog(`Dashboard refresh failed: ${error.message}`, 'error');
                });
        }
        
        function clearLogs() {
            const logContainer = document.getElementById('logContainer');
            logContainer.innerHTML = '';
            addLog('Logs cleared', 'info');
        }
        
        function shutdownServer() {
            if (confirm('Are you sure you want to shutdown the server?')) {
                fetch('/api/shutdown', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        addLog('Server shutdown initiated', 'warning');
                    })
                    .catch(error => {
                        addLog(`Shutdown failed: ${error.message}`, 'error');
                    });
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            connectWebSocket();
            refreshData();
            
            // Auto-refresh every 30 seconds
            setInterval(refreshData, 30000);
        });
    </script>
</body>
</html>
